name: Cover Studio regression

on:
  push:
    branches: [cover-studio, fix/yue2-vulkan-alignment]
  pull_request:
    branches: [cover-studio]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure the tested model set with tests enabled
        run: >-
          cmake -S . -B build/cover-studio-ci
          -DCMAKE_BUILD_TYPE=Release
          -DENGINE_ENABLE_CUDA=OFF
          -DENGINE_ENABLE_VULKAN=OFF
          -DENGINE_BUILD_TESTS=ON
          -DAUDIOCPP_MODEL_SET=custom
          '-DAUDIOCPP_MODELS=yue2;qwen3_asr'
      - name: Build focused regressions
        run: cmake --build build/cover-studio-ci --parallel 4 --target rope_position_view_test col2im_dispatch_test
      - name: Run RoPE CPU reference regression
        run: ctest --test-dir build/cover-studio-ci --output-on-failure --no-tests=error -R '^rope_position_view_test$'
      # Physical Vulkan GPU runs are documented in COVER_STUDIO_GPU_FIXES.md.
      # A hosted CPU runner cannot establish hardware GPU correctness.
